<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upps Anda Benar!</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN untuk efek selebrasi -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Outfits & Comic Neue -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .fun-font {
            font-family: 'Fredoka', cursive;
        }

        /* Animasi mengambang untuk emot/kartu */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Animasi denyut halus */
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        .animate-pulse-subtle {
            animation: pulse-subtle 2s ease-in-out infinite;
        }

        /* Glassmorphism Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* Background Blob Animated */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }

        .animate-blob {
            animation: blob 7s infinite;
        }

        .animation-delay-2000 {
            animation-delay: 2s;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 relative overflow-x-hidden selection:bg-purple-300 selection:text-purple-900">

    <!-- Latar Belakang Elemen Dekoratif (Blobs) -->
    <div class="absolute top-10 left-10 w-72 h-72 bg-pink-400 rounded-full filter blur-3xl opacity-40 animate-blob"></div>
    <div class="absolute bottom-10 right-10 w-80 h-80 bg-yellow-300 rounded-full filter blur-3xl opacity-40 animate-blob animation-delay-2000"></div>
    <div class="absolute top-1/2 left-1/3 w-64 h-64 bg-indigo-400 rounded-full filter blur-3xl opacity-30 animate-blob"></div>

    <!-- Main Container / Card -->
    <main class="relative z-10 w-full max-w-lg glass-card rounded-3xl p-8 sm:p-10 shadow-2xl text-center animate-float border border-white/50 my-auto">
        
        <!-- Icon / Stiker Lucu di Atas -->
        <div class="relative inline-block mb-4">
            <div class="w-24 h-24 sm:w-28 sm:h-28 bg-gradient-to-tr from-amber-300 to-amber-500 rounded-full flex items-center justify-center shadow-lg mx-auto text-5xl sm:text-6xl transform hover:scale-110 transition-transform duration-300 cursor-pointer" onclick="triggerConfetti()">
                🤭
            </div>
            <!-- Badge melayang kecil -->
            <span class="absolute -top-2 -right-2 bg-purple-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-md animate-bounce">
                100% Valid!
            </span>
        </div>

        <!-- Teks Utama -->
        <h1 class="fun-font text-4xl sm:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 via-pink-600 to-indigo-600 tracking-wide mb-3">
            Upps, Anda Benar! 🎉
        </h1>

        <!-- Deskripsi Lucu -->
        <p class="text-gray-600 text-base sm:text-lg mb-6 leading-relaxed">
            Wah, firasat atau tebakan Anda luar biasa tepat! Padahal rahasia ini sudah disembunyikan rapat-rapat... 🤫✨
        </p>

        <!-- Kotak Kutipan / Pesan Tambahan -->
        <div class="bg-purple-50/80 border border-purple-200 rounded-2xl p-4 mb-8 text-sm sm:text-base text-purple-900 font-medium shadow-inner flex items-start space-x-3 text-left">
            <i class="fa-solid fa-lightbulb text-amber-500 text-xl mt-0.5 flex-shrink-0"></i>
            <div>
                <span id="randomQuote">"Tebakan setingkat dewa! Tingkat keakuratan Anda 99.9%."</span>
            </div>
        </div>

        <!-- Tombol Aksi & Interaksi -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
            <button onclick="triggerConfetti()" class="w-full sm:w-auto px-6 py-3.5 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-bold rounded-2xl shadow-lg hover:shadow-purple-500/30 active:scale-95 transition-all duration-200 flex items-center justify-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>Rayakan Lagi!</span>
            </button>

            <button onclick="changeQuote()" class="w-full sm:w-auto px-5 py-3.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-2xl border border-gray-200 active:scale-95 transition-all duration-200 flex items-center justify-center gap-2">
                <i class="fa-solid fa-shuffle text-gray-500"></i>
                <span>Respon Lain</span>
            </button>
        </div>

        <!-- Footer Kecil -->
        <div class="mt-8 pt-4 border-t border-gray-100 text-xs text-gray-400">
            Dibuat dengan ❤️ & sedikit rasa kaget karena kamu benar!
        </div>
    </main>

    <!-- Script Logika & Interaktivitas -->
    <script>
        // Kumpulan kata-kata lucu opsional
        const quotes = [
            '"Tebakan setingkat dewa! Tingkat keakuratan Anda 99.9%."',
            '"Kok bisa tahu sih? Jangan-jangan kamu dukun ya? 🤔"',
            '"Jangan bilang siapa-siapa ya, ini rahasia kita berdua! 🤫"',
            '"Selamat! Anda berhak mendapatkan ucapan selamat dari saya 🎉"',
            '"Sensasional! Intuisi kamu beneran tidak ada tandingannya 😎"'
        ];

        // Jalankan efek konfeti saat halaman pertama kali dimuat
        window.onload = function() {
            setTimeout(() => {
                triggerConfetti();
            }, 300);
        };

        // Fungsi memicu ledakan konfeti
        function triggerConfetti() {
            // Konfeti dari dua sisi
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        // Fungsi mengganti teks kutipan secara acak
        function changeQuote() {
            const quoteElement = document.getElementById('randomQuote');
            const currentIndex = quotes.indexOf(quoteElement.innerText);
            let nextIndex = Math.floor(Math.random() * quotes.length);
            
            // Memastikan kutipan tidak sama persis berturut-turut
            while (nextIndex === currentIndex) {
                nextIndex = Math.floor(Math.random() * quotes.length);
            }

            // Efek fade halus sederhana
            quoteElement.style.opacity = '0';
            setTimeout(() => {
                quoteElement.innerText = quotes[nextIndex];
                quoteElement.style.opacity = '1';
            }, 150);

            // Bunyikan konfeti kecil saat ganti
            confetti({
                particleCount: 25,
                spread: 40,
                origin: { y: 0.7 }
            });
        }
    </script>
</body>
</html>
