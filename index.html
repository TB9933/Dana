<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="doc-title">REKAP PARKIR - YOUR NAME</title>
<style>
body {font-family:Arial; margin:8px; background:#f0f8ff;}
.header {background:rgba(0,75,147,0.1); padding:10px; text-align:center; border:2px solid #004B93; border-radius:10px;}
.header img {width:100px; border-radius:8px;}
.header h2,.header h3 {color:#004B93; margin:5px 0; font-size:16px;}
.header h3 {font-size:14px;}
input,button {padding:10px; margin:5px 0; width:100%; border-radius:5px; border:1px solid #ccc; box-sizing:border-box;}
.btn-bri {background:#004B93; color:white; border:none; font-weight:bold; cursor:pointer;}
.btn-geo {background:#2E7D32; color:white; border:none; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px;}
.btn-edit {background:#F57C00; color:white; border:none; padding:5px 8px; border-radius:4px; font-size:12px; width:auto; margin:2px; cursor:pointer;}
.btn-delete {background:#D32F2F; color:white; border:none; padding:5px 8px; border-radius:4px; font-size:12px; width:auto; margin:2px; cursor:pointer;}
.btn-map {background:#0288D1; color:white; border:none; padding:5px 8px; border-radius:4px; font-size:12px; text-decoration:none; display:inline-block; margin:2px;}
.btn-nama {background:#673AB7; color:white; border:none; font-weight:bold; cursor:pointer; margin-bottom:10px;}
.input-group {display:flex; gap:5px; margin:5px 0;}
.input-group input {margin:0; flex:1;}
.input-group button {margin:0; width:auto; white-space:nowrap;}
table {width:100%; border-collapse:collapse; margin-top:10px; font-size:12px; background:white;}
th {background:#004B93; color:white; padding:6px;}
td {border:1px solid #004B93; padding:5px; text-align:center;}
tr:nth-child(even) {background:rgba(0,75,147,0.05);}
.footer-ttd {margin-top:50px; text-align:right; padding-right:20px; font-size:14px;}
@media print {
  .no-print {display:none !important;}
  .header {background:white; border:none;}
}
</style>
</head>
<body>

<div class="header">
  <img src="https://i.imgur.com/8KmZW3V.jpg" alt="Pajero">
  <h2>REKAP PARKIR TANPA KARCIS</h2>
  <h3 id="header-nama">YOUR NAME</h3>
</div>

<div class="no-print">
  <button type="button" class="btn-nama" onclick="mintaNamaBaru()">✏️ Ubah Nama Pemilik</button>
  <div class="input-group">
    <input type="text" id="lokasi" placeholder="LOKASI / NAMA JALAN / LAT,LONG">
    <button type="button" class="btn-geo" onclick="dapatkanLokasiOtomatis()" id="btnLokasi">📍 Cari Alamat & GPS</button>
  </div>
  <input type="text" id="nopol" placeholder="NOPOL + JENIS MOBIL">
  <input type="number" id="bayar" placeholder="BAYAR" value="4000">
  <button class="btn-bri" onclick="simpan()">SIMPAN DATA HARI INI</button>
  <button class="btn-bri" onclick="window.print()">PRINT REKAP + TOTAL</button>
</div>

<table id="tabel">
  <thead>
    <tr>
      <th>TGL</th>
      <th>HARI</th>
      <th>JAM</th>
      <th>LOKASI & ALAMAT</th>
      <th>NOPOL</th>
      <th>BAYAR</th>
      <th class="no-print">AKSI</th>
    </tr>
  </thead>
  <tbody></tbody>
  <tfoot>
    <tr>
      <td colspan="5"><b>TOTAL</b></td>
      <td colspan="2" id="total">Rp 0</td>
    </tr>
  </tfoot>
</table>

<div class="footer-ttd">
  Menyerahkan,<br><br>
  Tgl:......../......../........<br><br><br>
  <b id="ttd-nama">YOUR NAME</b>
</div>

<script>
const STORAGE_KEY = 'parkirDanang';
const NAMA_KEY = 'parkirNamaPemilik';
const DEFAULT_NAMA = 'YOUR NAME';

let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

// Fungsi untuk memeriksa dan memperbarui nama di Head & TTD
function inisialisasiNama() {
  let namaTersimpan = localStorage.getItem(NAMA_KEY);
  
  if (!namaTersimpan) {
    namaTersimpan = prompt("Masukkan Nama Pemilik Rekap Parkir:", DEFAULT_NAMA);
    if (!namaTersimpan || !namaTersimpan.trim()) {
      namaTersimpan = DEFAULT_NAMA;
    }
    localStorage.setItem(NAMA_KEY, namaTersimpan.trim());
  }
  
  terapkanNama(namaTersimpan);
}

// Fungsi menerapkan teks nama ke DOM
function terapkanNama(nama) {
  let namaUpper = nama.toUpperCase();
  document.getElementById('header-nama').innerText = namaUpper;
  document.getElementById('ttd-nama').innerText = namaUpper;
  document.getElementById('doc-title').innerText = "REKAP PARKIR - " + namaUpper;
}

// Fungsi jika pengguna ingin mengubah nama lewat tombol
function mintaNamaBaru() {
  let namaLama = localStorage.getItem(NAMA_KEY) || DEFAULT_NAMA;
  let namaBaru = prompt("Edit Nama Pemilik:", namaLama);
  
  if (namaBaru !== null) {
    let namaSimpan = namaBaru.trim() === "" ? DEFAULT_NAMA : namaBaru.trim();
    localStorage.setItem(NAMA_KEY, namaSimpan);
    terapkanNama(namaSimpan);
  }
}

function simpanStorage() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// Fungsi Mendapatkan GPS Sekaligus Nama Alamat (Reverse Geocoding)
function dapatkanLokasiOtomatis() {
  const btn = document.getElementById('btnLokasi');
  const inputLokasi = document.getElementById('lokasi');

  if (!navigator.geolocation) {
    alert("Browser Anda tidak mendukung GPS.");
    return;
  }

  btn.disabled = true;
  btn.innerText = "⏳ Melacak Lokasi...";

  navigator.geolocation.getCurrentPosition(
    async (position) => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const akurasi = Math.round(position.coords.accuracy);

      inputLokasi.value = `Memuat nama jalan... (${lat.toFixed(6)}, ${lng.toFixed(6)})`;

      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`, {
          headers: {
            'User-Agent': 'RekapParkirApp/1.0'
          }
        });
        const result = await response.json();
        
        if (result && result.display_name) {
          let namaJalan = result.address.road || result.address.suburb || result.address.village || result.address.city_district || '';
          let wilayah = result.address.city || result.address.town || result.address.county || '';
          
          let formatAlamat = namaJalan ? `${namaJalan}, ${wilayah}` : result.display_name;
          inputLokasi.value = `${formatAlamat} [${lat.toFixed(6)}, ${lng.toFixed(6)}]`;
        } else {
          inputLokasi.value = `[${lat.toFixed(6)}, ${lng.toFixed(6)}] (±${akurasi}m)`;
        }
      } catch (err) {
        inputLokasi.value = `[${lat.toFixed(6)}, ${lng.toFixed(6)}] (±${akurasi}m)`;
      }

      btn.disabled = false;
      btn.innerText = "📍 Cari Alamat & GPS";
    },
    (error) => {
      btn.disabled = false;
      btn.innerText = "📍 Cari Alamat & GPS";
      alert("Gagal mendeteksi GPS. Pastikan izin lokasi aktif.");
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

function render() {
  let tbody = document.querySelector('#tabel tbody');
  tbody.innerHTML = '';
  let total = 0;

  data.forEach((d, i) => {
    total += Number(d.bayar) || 0;

    let tr = document.createElement('tr');
    
    [d.tgl, d.hari, d.jam].forEach(teks => {
      let td = document.createElement('td');
      td.textContent = teks;
      tr.appendChild(td);
    });

    let tdLokasi = document.createElement('td');
    tdLokasi.innerHTML = d.lokasi;
    
    let matchCoord = d.lokasi.match(/\[(-?\d+\.\d+),\s*(-?\d+\.\d+)\]/);
    if (matchCoord) {
      let lat = matchCoord[1];
      let lng = matchCoord[2];
      let gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
      tdLokasi.innerHTML += `<br><a href="${gmapsUrl}" target="_blank" class="btn-map no-print">🗺️ Buka G.Maps</a>`;
    }
    tr.appendChild(tdLokasi);

    let tdNopol = document.createElement('td');
    tdNopol.textContent = d.nopol;
    tr.appendChild(tdNopol);

    let tdBayar = document.createElement('td');
    tdBayar.textContent = 'Rp ' + (Number(d.bayar) || 0).toLocaleString('id-ID');
    tr.appendChild(tdBayar);

    let aksi = document.createElement('td');
    aksi.className = 'no-print';

    let edit = document.createElement('button');
    edit.className = 'btn-edit';
    edit.textContent = 'EDIT';
    edit.onclick = () => editData(i);

    let hapus = document.createElement('button');
    hapus.className = 'btn-delete';
    hapus.textContent = 'DELETE';
    hapus.onclick = () => hapusData(i);

    aksi.append(edit, hapus);
    tr.appendChild(aksi);
    tbody.appendChild(tr);
  });

  document.getElementById('total').innerText =
    'Rp ' + total.toLocaleString('id-ID');
}

function simpan() {
  let now = new Date();
  let hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][now.getDay()];

  let item = {
    tgl: now.toLocaleDateString('id-ID'),
    hari: hari,
    jam: now.toLocaleTimeString('id-ID').slice(0,5),
    lokasi: document.getElementById('lokasi').value.trim(),
    nopol: document.getElementById('nopol').value.trim(),
    bayar: document.getElementById('bayar').value || 0
  };

  if (!item.lokasi || !item.nopol) {
    alert('Isi Lokasi dan Nopol dulu!');
    return;
  }

  data.push(item);
  simpanStorage();
  render();

  document.getElementById('lokasi').value = '';
  document.getElementById('nopol').value = '';
}

function editData(i) {
  let d = data[i];
  let lokasi = prompt('Edit Lokasi:', d.lokasi);
  if (lokasi === null) return;

  let nopol = prompt('Edit Nopol:', d.nopol);
  if (nopol === null) return;

  let bayar = prompt('Edit Bayar:', d.bayar);
  if (bayar === null) return;

  if (!lokasi.trim() || !nopol.trim() || bayar.trim() === '' ||
      !Number.isFinite(Number(bayar)) || Number(bayar) < 0) {
    alert('Data tidak valid!');
    return;
  }

  data[i] = {
    ...d,
    lokasi: lokasi.trim(),
    nopol: nopol.trim(),
    bayar: Number(bayar)
  };

  simpanStorage();
  render();
}

function hapusData(i) {
  let d = data[i];

  let yakin = confirm(
    'Yakin ingin menghapus data ini?\n\n' +
    'Tanggal: ' + d.tgl + '\n' +
    'Lokasi: ' + d.lokasi + '\n' +
    'Nopol: ' + d.nopol + '\n' +
    'Bayar: Rp ' + Number(d.bayar).toLocaleString('id-ID')
  );

  if (!yakin) return;

  data.splice(i, 1);
  simpanStorage();
  render();
}

// Jalankan pemeriksaan nama saat halaman pertama kali dibuka
inisialisasiNama();
render();
</script>

</body>
</html>
